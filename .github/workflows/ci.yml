name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate skills
        run: ./scripts/validate-all-skills.sh
      - name: Run unit tests
        env:
          APP_IMAGE: deploy-skills-fastapi
          APP_VERSION: fixture-test
          POSTGRES_DB: fixture
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-local-only-password
          DATABASE_URL: postgresql+psycopg://fixture:fixture-local-only-password@db:5432/fixture
          REDIS_PASSWORD: fixture-local-only-cache-password
          REDIS_URL: redis://:fixture-local-only-cache-password@redis:6379/0
        run: python3 -m unittest discover -s tests -v
      - name: Validate evaluation JSON
        run: python3 -m json.tool evals/prompts.json >/dev/null && python3 -m json.tool evals/expected-invariants.json >/dev/null
      - name: Audit Next.js production dependencies
        run: npm audit --omit=dev --prefix fixtures/nextjs

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast-checks
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - fastapi-postgres
          - fastapi-postgres-redis
          - nextjs
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run production fixture
        run: ./scripts/run-fixture.sh fixtures/${{ matrix.fixture }}

  local-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast-checks
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - fastapi-postgres-redis
          - nextjs
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run local Compose fixture
        run: ./scripts/run-local-fixture.sh fixtures/${{ matrix.fixture }}
