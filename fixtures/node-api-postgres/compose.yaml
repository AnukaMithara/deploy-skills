name: deploy-skills-node-api

services:
  app:
    image: ${APP_IMAGE:-deploy-skills-node-api}:${APP_VERSION:-development}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://127.0.0.1:3000/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  migrate:
    image: ${APP_IMAGE:-deploy-skills-node-api}:${APP_VERSION:-development}
    command: ["app/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - tools

  db:
    image: postgres:17-alpine
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
