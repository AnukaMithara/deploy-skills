services:
  app:
    image: ${APP_IMAGE:-deploy-skills-nextjs}:${APP_VERSION:-development}
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  edge:
