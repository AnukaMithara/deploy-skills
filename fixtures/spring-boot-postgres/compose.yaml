name: deploy-skills-spring-boot

services:
  app:
    image: ${APP_IMAGE:-deploy-skills-spring-boot}:${APP_VERSION:-development}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  migrate:
    image: ${APP_IMAGE:-deploy-skills-spring-boot}:${APP_VERSION:-development}
    command: ["java", "-jar", "app.jar", "--spring.main.web-application-type=none", "--spring.flyway.enabled=true"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - tools

  db:
    image: postgres:17-alpine
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
