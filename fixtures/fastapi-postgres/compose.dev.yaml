services:
  app:
    image: deploy-skills-fastapi:development
    build:
      context: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+psycopg://fixture:fixture-local-only-password@db:5432/fixture
    ports:
      - "127.0.0.1:${APP_PORT:-18000}:8000"
    volumes:
      - ./app:/app/app:ro

  migrate:
    image: deploy-skills-fastapi:development
    environment:
      DATABASE_URL: postgresql+psycopg://fixture:fixture-local-only-password@db:5432/fixture

  db:
    environment:
      POSTGRES_DB: fixture
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: fixture-local-only-password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"

networks:
  backend:
    internal: false
